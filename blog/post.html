<!DOCTYPE html>
<html class="blog-post" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Govind Gandhi</title>
  <link rel="icon" type="image/png" href="../images/logo.png" sizes="32x32" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../public/styles.css" />
  <link rel="stylesheet" href="../public/mobile-responsive.css" />
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* Blog post styles */
    .post-container {
      max-width: 800px;
      margin: 120px auto 60px;
      padding: 0 30px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 40px;
      color: #6BD490;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .post-header {
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid #333;
    }

    .post-header h1 {
      font-size: 2.2rem;
      margin: 0 0 15px;
      color: #fff;
      line-height: 1.3;
    }

    .post-meta {
      color: #888;
      font-size: 0.95rem;
    }

    /* Markdown content styles */
    .post-content {
      color: #ddd;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4 {
      color: #fff;
      margin-top: 2em;
      margin-bottom: 0.8em;
    }

    .post-content h1 { font-size: 1.8rem; }
    .post-content h2 { font-size: 1.5rem; }
    .post-content h3 { font-size: 1.3rem; }
    .post-content h4 { font-size: 1.1rem; }

    .post-content p {
      margin-bottom: 1.5em;
    }

    .post-content a {
      color: #6BD490;
      text-decoration: none;
    }

    .post-content a:hover {
      text-decoration: underline;
    }

    .post-content code {
      background: #1e1e1e;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Fira Code', 'Monaco', monospace;
      font-size: 0.9em;
    }

    .post-content pre {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1.5em 0;
    }

    .post-content pre code {
      background: none;
      padding: 0;
    }

    .post-content blockquote {
      border-left: 4px solid #6BD490;
      margin: 1.5em 0;
      padding: 0.5em 0 0.5em 1.5em;
      color: #aaa;
      font-style: italic;
    }

    .post-content ul,
    .post-content ol {
      margin: 1.5em 0;
      padding-left: 2em;
    }

    .post-content li {
      margin-bottom: 0.5em;
    }

    .post-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1.5em 0;
    }

    .post-content hr {
      border: none;
      border-top: 1px solid #333;
      margin: 2em 0;
    }

    .post-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
    }

    .post-content th,
    .post-content td {
      border: 1px solid #333;
      padding: 10px 15px;
      text-align: left;
    }

    .post-content th {
      background: #1e1e1e;
      color: #fff;
    }

    .error-message {
      color: #ff6b6b;
      text-align: center;
      padding: 40px;
    }

    .loading {
      color: #888;
      text-align: center;
      padding: 40px;
    }

    @media screen and (max-width: 768px) {
      .post-container {
        margin-top: 80px;
        padding: 0 20px;
      }

      .post-header h1 {
        font-size: 1.7rem;
      }

      .post-content {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body class="blog-post">
  <nav class="navigation" role="navigation" aria-label="Global">
    <a class="navigation__link" href="../index.html">
      Govind Gandhi
    </a>
    <button class="navigation__button" aria-expanded="false" aria-controls="navigation__list">Open Global Menu</button>
    <ul class="navigation__list" id="navigation__list">
      <li class="navigation__list__item"><a class="navigation__list__link" href="../index.html#work">Work</a></li>
      <li class="navigation__list__item"><a class="navigation__list__link" href="../resume.pdf" target="_blank">Resume</a></li>
      <li class="navigation__list__item"><a class="navigation__list__link" href="index.html">Blog</a></li>
    </ul>
  </nav>

  <main class="post-container">
    <a href="index.html" class="back-link">&larr; Back to blog</a>

    <article id="post-article">
      <div class="loading">Loading post...</div>
    </article>
  </main>

  <script>
    // Configure marked
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    async function loadPost() {
      const article = document.getElementById('post-article');
      const params = new URLSearchParams(window.location.search);
      const postFile = params.get('p');

      if (!postFile) {
        article.innerHTML = '<div class="error-message">No post specified.</div>';
        return;
      }

      try {
        // Load post metadata from posts.json
        const metaResponse = await fetch('posts.json');
        let postMeta = null;

        if (metaResponse.ok) {
          const posts = await metaResponse.json();
          postMeta = posts.find(p => p.file === postFile);
        }

        // Load the markdown file
        const response = await fetch(`posts/${postFile}`);
        if (!response.ok) throw new Error('Post not found');

        const markdown = await response.text();
        const htmlContent = marked.parse(markdown);

        // Extract title from first h1 or use metadata
        let title = postMeta?.title || postFile.replace('.md', '');
        const titleMatch = markdown.match(/^#\s+(.+)$/m);
        if (titleMatch) {
          title = titleMatch[1];
        }

        // Update page title
        document.title = `${title} | Govind Gandhi`;

        // Build the article HTML
        const dateHtml = postMeta?.date
          ? `<div class="post-meta">${formatDate(postMeta.date)}</div>`
          : '';

        article.innerHTML = `
          <header class="post-header">
            <h1>${escapeHtml(title)}</h1>
            ${dateHtml}
          </header>
          <div class="post-content">${htmlContent}</div>
        `;

        // Apply syntax highlighting to any code blocks
        document.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });

      } catch (error) {
        article.innerHTML = `<div class="error-message">
          <p>Could not load the post.</p>
          <p><a href="index.html">Return to blog</a></p>
        </div>`;
      }
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadPost();
  </script>
</body>
</html>
